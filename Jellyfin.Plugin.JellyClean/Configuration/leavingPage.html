<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JellyClean leaving soon</title>
</head>
<body>
    <div id="JellyCleanLeavingPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
        <style>
            /* Same look as the Library page, scoped to this page. */
            #JellyCleanLeavingPage {
                --jc-accent: #00a4dc;
                --jc-accent-2: #aa5cc3;
                --jc-line: rgba(128, 128, 128, 0.22);
                --jc-card: rgba(128, 128, 128, 0.07);
                --jc-radius: 14px;
            }
            #JellyCleanLeavingPage .content-primary { max-width: 1240px; padding-bottom: 4em; }
            #JellyCleanLeavingPage .jc-tabs { display: flex; gap: 0.4em; flex-wrap: wrap; margin: 1em 0 1.4em; }
            #JellyCleanLeavingPage .jc-tab { padding: 0.6em 1.2em; border-radius: 999px; border: 1px solid var(--jc-line); font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: inherit; opacity: 0.75; }
            #JellyCleanLeavingPage .jc-tab[aria-current="page"] { background: linear-gradient(135deg, var(--jc-accent-2), var(--jc-accent)); border-color: transparent; color: #fff; opacity: 1; }
            #JellyCleanLeavingPage .jc-card { background: var(--jc-card); border: 1px solid var(--jc-line); border-radius: var(--jc-radius); padding: 1.3em 1.4em; }
            #JellyCleanLeavingPage .jc-card h2 { margin: 0 0 0.25em; font-size: 1.15em; font-weight: 600; }
            #JellyCleanLeavingPage .jc-hint { margin: 0; opacity: 0.7; font-size: 0.92em; flex: 1 1 300px; }
            #JellyCleanLeavingPage .jc-row { display: flex; gap: 1em; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 0.8em; }
            #JellyCleanLeavingPage .jc-actions { display: flex; gap: 0.5em; flex: 1 1 300px; justify-content: flex-end; }
            #JellyCleanLeavingPage .jc-btn { padding: 0.75em 0.9em; border-radius: 10px; border: 1px solid var(--jc-line); font: inherit; font-weight: 600; cursor: pointer; background: rgba(128, 128, 128, 0.15); color: inherit; white-space: nowrap; }
            #JellyCleanLeavingPage .jc-btn[aria-pressed="true"] { border-color: currentColor; }
            @media (max-width: 600px) { #JellyCleanLeavingPage .jc-actions .jc-btn { flex: 1 1 0; } }
            #JellyCleanLeavingPage button:focus-visible { outline: 2px solid var(--jc-accent); outline-offset: 2px; }
            #JellyCleanLeavingPage .jc-item { display: flex; gap: 1em; align-items: center; flex-wrap: wrap; padding: 0.8em 0; border-top: 1px solid var(--jc-line); }
            #JellyCleanLeavingPage .jc-item-text { flex: 1 1 320px; min-width: 0; }
            #JellyCleanLeavingPage .jc-item-text b { display: block; }
            #JellyCleanLeavingPage .jc-item-text small { display: block; opacity: 0.7; }
            #JellyCleanLeavingPage .jc-size { font-weight: 600; font-variant-numeric: tabular-nums; }
            #JellyCleanLeavingPage .jc-btn.primary { background: linear-gradient(135deg, var(--jc-accent-2), var(--jc-accent)); border-color: transparent; color: #fff; }
            #JellyCleanLeavingPage .jc-btn.danger { background: transparent; border-color: rgba(220, 70, 70, 0.7); color: #e05a5a; }
            #JellyCleanLeavingPage .jc-btn:disabled { opacity: 0.5; cursor: default; }
            #JellyCleanLeavingPage .jc-empty { padding: 1.2em 0; opacity: 0.7; }
            #JellyCleanLeavingPage .jc-msg { font-size: 0.9em; flex: 1 1 100%; }
            #JellyCleanLeavingPage .jc-msg.ok { color: #66bb6a; }
            #JellyCleanLeavingPage .jc-msg.bad { color: #e0a33a; }
            #JellyCleanLeavingPage .jc-card + .jc-card { margin-top: 1.2em; }
            #JellyCleanLeavingPage .jc-poster { width: 48px; height: 72px; flex: none; border-radius: 8px; object-fit: cover; background: rgba(128, 128, 128, 0.2); }
            #JellyCleanLeavingPage .jc-poster.wide { width: 96px; height: 54px; }
            #JellyCleanLeavingPage .jc-item-text .jc-due { color: #f0b429; font-weight: 600; }
            #JellyCleanLeavingPage .jc-item-text .jc-stay { color: #c58ad8; }
            #JellyCleanLeavingPage .jc-item-text a { color: inherit; text-decoration: none; }
            #JellyCleanLeavingPage .jc-item-text a:hover { text-decoration: underline; }
            #JellyCleanLeavingPage .jc-details { display: block; margin: 0.15em 0 0.25em; }
            #JellyCleanLeavingPage .jc-tags { display: flex; gap: 0.35em; flex-wrap: wrap; margin-top: 0.3em; }
            #JellyCleanLeavingPage .jc-tag { font-size: 0.78em; padding: 0.1em 0.6em; border-radius: 999px; border: 1px solid var(--jc-line); white-space: nowrap; }
            #JellyCleanLeavingPage .jc-tag.never { border-color: rgba(240, 180, 41, 0.6); color: #f0b429; }
            #JellyCleanLeavingPage .jc-tag.watched { border-color: rgba(76, 175, 80, 0.6); color: #66bb6a; }
            #JellyCleanLeavingPage .jc-tag.quality { border-color: rgba(0, 164, 220, 0.6); color: #4fc3f7; }
            #JellyCleanLeavingPage .jc-tag.copy { border-color: rgba(240, 120, 60, 0.6); color: #ff9a5c; }
            #JellyCleanLeavingPage .jc-tag.protected { border-color: rgba(170, 92, 195, 0.7); color: #c58ad8; }
            #JellyCleanLeavingPage .jc-section { margin: 1.2em 0 0.2em; font-weight: 600; opacity: 0.85; }
            #JellyCleanLeavingPage .jc-status { margin: 0 0 1em; padding: 0.8em 1em; border-radius: 10px; border: 1px solid rgba(0, 164, 220, 0.5); background: rgba(0, 164, 220, 0.1); font-weight: 600; }
            #JellyCleanLeavingPage .jc-review { margin: 0.8em 0 1em; padding: 1em; border-radius: 12px; border: 1px solid rgba(240, 180, 41, 0.5); background: rgba(240, 180, 41, 0.06); }
            #JellyCleanLeavingPage .jc-review-foot { display: flex; gap: 0.6em; flex-wrap: wrap; justify-content: flex-end; margin-top: 0.8em; }
            #JellyCleanLeavingPage .jc-rule { padding: 1em 0; border-top: 1px solid var(--jc-line); }
            #JellyCleanLeavingPage .jc-rule-head { display: flex; gap: 0.6em; align-items: baseline; flex-wrap: wrap; margin-bottom: 0.6em; }
            #JellyCleanLeavingPage .jc-rule-head small { opacity: 0.7; }
            #JellyCleanLeavingPage .jc-rule-head .jc-saved { margin-left: auto; font-size: 0.85em; color: #66bb6a; }
            #JellyCleanLeavingPage .jc-rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7em; align-items: end; }
            #JellyCleanLeavingPage .jc-rule-grid label { display: flex; flex-direction: column; gap: 0.3em; font-size: 0.85em; font-weight: 600; }
            #JellyCleanLeavingPage .jc-rule-grid select, #JellyCleanLeavingPage .jc-rule-grid input { width: 100%; box-sizing: border-box; min-height: 44px; padding: 0.55em 0.7em; border-radius: 10px; font: inherit; font-weight: 400; border: 1px solid var(--jc-line); background: rgba(128, 128, 128, 0.1); color: inherit; }
            #JellyCleanLeavingPage .jc-rule-grid select:focus-visible, #JellyCleanLeavingPage .jc-rule-grid input:focus-visible { outline: 2px solid var(--jc-accent); outline-offset: 1px; }
            #JellyCleanLeavingPage .jc-rule-foot { display: flex; gap: 0.6em; flex-wrap: wrap; align-items: center; margin-top: 0.7em; }
            #JellyCleanLeavingPage .jc-toggle { display: inline-flex; align-items: center; gap: 0.6em; min-height: 44px; padding: 0 0.2em; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; text-align: left; flex: 1 1 260px; }
            #JellyCleanLeavingPage .jc-switch { position: relative; width: 46px; height: 26px; flex: none; border-radius: 999px; background: rgba(128, 128, 128, 0.45); transition: background 0.2s; }
            #JellyCleanLeavingPage .jc-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
            #JellyCleanLeavingPage [aria-checked="true"] > .jc-switch { background: #e05a5a; }
            #JellyCleanLeavingPage [aria-checked="true"] > .jc-switch::after { transform: translateX(20px); }
            #JellyCleanLeavingPage .jc-btn { min-height: 44px; }
            @media (max-width: 600px) {
                #JellyCleanLeavingPage .jc-card { padding: 1em; }
                #JellyCleanLeavingPage .jc-item { gap: 0.7em; align-items: flex-start; }
                #JellyCleanLeavingPage .jc-item-text { flex: 1 1 calc(100% - 64px); }
                #JellyCleanLeavingPage .jc-item .jc-size { margin-left: calc(48px + 0.7em); }
                #JellyCleanLeavingPage .jc-item .jc-btn { flex: 1 1 100%; }
                #JellyCleanLeavingPage .jc-rule-foot .jc-btn { flex: 1 1 0; }
            }
            @media (prefers-reduced-motion: reduce) { #JellyCleanLeavingPage * { transition: none !important; } }
            #JellyCleanLeavingPage [hidden] { display: none !important; }
        </style>

        <div data-role="content">
            <div class="content-primary">
                <nav class="jc-tabs" aria-label="JellyClean">
                    <button type="button" class="jc-tab" data-page="JellyClean">Library</button>
                    <button type="button" class="jc-tab" aria-current="page">Leaving soon</button>
                    <button type="button" class="jc-tab" data-page="JellyCleanRecover">Recover</button>
                    <button type="button" class="jc-tab" data-page="JellyCleanSettings">Settings</button>
                    <button type="button" class="jc-tab" data-page="JellyCleanActivity">Activity</button>
                </nav>

                <div class="jc-status" id="jcStatus" role="status" aria-live="polite" hidden></div>

                <section class="jc-card" aria-labelledby="jcListTitle">
                    <h2 id="jcListTitle">Leaving soon</h2>
                    <div class="jc-row">
                        <p class="jc-hint" id="jcSummary" aria-live="polite">Loading...</p>
                        <div class="jc-actions">
                            <button type="button" class="jc-btn danger" id="jcReview" hidden>Review due items</button>
                        </div>
                    </div>
                    <div class="jc-review" id="jcReviewBox" hidden></div>
                    <div id="jcList"></div>
                </section>

                <section class="jc-card" aria-labelledby="jcRulesTitle">
                    <h2 id="jcRulesTitle">Rules</h2>
                    <div class="jc-row">
                        <p class="jc-hint">A rule is a saved filter from the Library page with a schedule. At its time it puts what it finds on this list, with its own notice period. Changes save right away.</p>
                        <div class="jc-actions">
                            <button type="button" class="jc-btn" id="jcRunAll">Run all rules now</button>
                        </div>
                    </div>
                    <div id="jcRules"></div>
                </section>
            </div>
        </div>

        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#JellyCleanLeavingPage');
                var pluginId = 'b0be751c-a689-46fd-bb83-4540a41cd649';
                var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                var config = {};
                var leaving = [];
                var limit = { due: 50, later: 50 };

                function $(id) { return page.querySelector('#' + id); }

                function el(tag, props) {
                    var e = document.createElement(tag);
                    Object.assign(e, props || {});
                    for (var i = 2; i < arguments.length; i++) {
                        if (arguments[i] != null) { e.append(arguments[i]); }
                    }
                    return e;
                }

                function bytes(n) {
                    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
                    var i = 0;
                    while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
                    return (i && n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + units[i];
                }

                function plural(n, one, many) { return n.toLocaleString() + ' ' + (n === 1 ? one : many); }
                function date(d) { return new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
                function when(d) { return new Date(d).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }

                function call(method, path, body) {
                    return fetch(ApiClient.getUrl('JellyClean/' + path), {
                        method: method,
                        headers: { 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"', 'Content-Type': 'application/json' },
                        body: body === undefined ? undefined : JSON.stringify(body)
                    }).then(function (r) {
                        if (!r.ok) { throw new Error('The server said ' + r.status); }
                        return r.status === 204 ? null : r.json();
                    });
                }

                function status(text) {
                    $('jcStatus').hidden = !text;
                    $('jcStatus').textContent = text || '';
                }

                // A season or episode without its own image shows its series poster.
                function poster(item) {
                    var img = el('img', { className: 'jc-poster' + (item.Type === 'Episode' ? ' wide' : ''), alt: '', loading: 'lazy', src: ApiClient.getImageUrl(item.Id, { type: 'Primary', maxHeight: 180 }) });
                    var fallback = item.SeriesId;
                    img.addEventListener('error', function () {
                        if (fallback) { img.className = 'jc-poster'; img.src = ApiClient.getImageUrl(fallback, { type: 'Primary', maxHeight: 180 }); fallback = null; } else { img.style.visibility = 'hidden'; }
                    });
                    return img;
                }

                // The same details as on the Library page.
                var users = {};
                var userCount = 0;
                function details(item) {
                    if (!item) { return null; }
                    var meta = [item.Library, item.Type === 'Series' || item.Type === 'Movie' ? item.Year : null, (item.Genres || []).slice(0, 3).join(', ')].filter(Boolean).join(' · ');
                    var who = (item.WatchedBy || []).map(function (id) { return users[id] || 'someone'; });
                    var watched = !item.AnyPlayed ? ['never', 'Never played']
                        : !who.length ? ['', 'Partly played']
                        : who.length >= userCount && userCount > 1 ? ['watched', 'Watched by everyone'] : ['watched', 'Watched by ' + who.join(', ')];
                    var fav = (item.FavoriteBy || []).map(function (id) { return users[id] || 'someone'; });
                    return el('span', { className: 'jc-details' },
                        meta ? el('small', { textContent: meta }) : null,
                        el('span', { className: 'jc-tags' },
                            el('span', { className: 'jc-tag', textContent: 'Added ' + date(item.Added) }),
                            el('span', { className: 'jc-tag ' + watched[0], textContent: watched[1] }),
                            item.LastWatched ? el('span', { className: 'jc-tag', textContent: 'Last played ' + date(item.LastWatched) }) : null,
                            item.Rating ? el('span', { className: 'jc-tag', textContent: '★ ' + item.Rating.toFixed(1) }) : null,
                            item.Resolution ? el('span', { className: 'jc-tag quality', textContent: [item.Resolution, item.Codec, item.Hdr].filter(Boolean).join(' · ') }) : null,
                            item.Ended && item.Type === 'Series' ? el('span', { className: 'jc-tag', textContent: 'Ended' }) : null,
                            (item.CopiesIn || []).length ? el('span', { className: 'jc-tag copy', textContent: 'Also in ' + item.CopiesIn.join(', ') }) : null,
                            fav.length ? el('span', { className: 'jc-tag protected', textContent: 'Favorite of ' + fav.join(', ') }) : null));
                }

                // The list

                function dueItems() { return leaving.filter(function (l) { return l.IsDue && !l.Protected; }); }

                function loadList() {
                    return call('GET', 'LeavingSoon').then(function (list) {
                        leaving = list;
                        renderList();
                    }).catch(function (err) { $('jcSummary').textContent = 'Could not load the list: ' + err.message; });
                }

                function renderList() {
                    var due = dueItems();
                    var size = leaving.reduce(function (sum, l) { return sum + l.Size; }, 0);
                    $('jcSummary').textContent = leaving.length
                        ? plural(leaving.length, 'item', 'items') + ', ' + bytes(size) + '. ' + (due.length ? plural(due.length, 'is due', 'are due') + '.' : 'Nothing is due yet.')
                        : 'Nothing is leaving. Put items here from the preview on the Library page, or with a rule below.';
                    $('jcReview').hidden = !due.length;
                    $('jcReview').textContent = 'Review due items (' + due.length + ')';

                    var box = $('jcList');
                    box.textContent = '';
                    [['due', 'Due now', leaving.filter(function (l) { return l.IsDue; })], ['later', 'Coming up', leaving.filter(function (l) { return !l.IsDue; })]].forEach(function (group) {
                        var key = group[0], items = group[2];
                        if (!items.length) { return; }
                        box.append(el('h3', { className: 'jc-section', textContent: group[1] + ' (' + items.length + ')' }));
                        items.slice(0, limit[key]).forEach(function (l) {
                                var cancel = el('button', { type: 'button', className: 'jc-btn', textContent: 'Cancel', title: 'Take it off the list; nothing is removed' });
                            cancel.setAttribute('aria-label', 'Take ' + l.Title + ' off the list');
                            cancel.dataset.cancel = l.Id;
                            var from = l.Source === 'you' ? 'Added by you' : 'From rule ' + l.Source;
                            box.append(el('div', { className: 'jc-item' }, poster(l),
                                el('div', { className: 'jc-item-text' },
                                    el('b', {}, el('a', { href: '#/details?id=' + l.Id, textContent: l.Title })),
                                    details(l.Item),
                                    el('small', { textContent: from + ' on ' + date(l.Added) + '. ' + (l.AutoRemove ? 'Goes on its own when due.' : 'Waits for you when due.') }),
                                    l.Protected ? el('small', { className: 'jc-stay', textContent: 'Will stay: ' + l.Protected })
                                        : el('small', { className: l.IsDue ? 'jc-due' : '', textContent: l.IsDue ? 'Due now' : 'Due ' + date(l.Due) })),
                                el('span', { className: 'jc-size', textContent: bytes(l.Size) }),
                                cancel));
                        });
                        if (items.length > limit[key]) {
                            var more = el('button', { type: 'button', className: 'jc-btn', textContent: 'Show ' + Math.min(50, items.length - limit[key]) + ' more' });
                            more.dataset.more = key;
                            box.append(more);
                        }
                    });
                }

                // Reviewing and removing due items, right here

                function review() {
                    var box = $('jcReviewBox');
                    box.hidden = false;
                    box.textContent = 'Checking Radarr, Sonarr and the safeguards...';
                    call('POST', 'Preview', { Ids: dueItems().map(function (l) { return l.Id; }) }).then(function (plan) {
                        var binDays = Math.max(config.RecycleDays || 0, 0);
                        box.textContent = '';
                        box.append(el('b', { textContent: plan.Remove.length ? 'Remove ' + plural(plan.Remove.length, 'item', 'items') + ', ' + plan.Size + '?' : 'Nothing can be removed' }),
                            el('p', { className: 'jc-hint', textContent: binDays ? 'They go to the recycle bin for ' + plural(binDays, 'day', 'days') + '; you can get them back on the Recover tab.' : 'The files are deleted from disk. This cannot be undone.' }));
                        if (plan.Skip.length) {
                            box.append(el('p', { className: 'jc-hint', textContent: plural(plan.Skip.length, 'item stays', 'items stay') + ': ' + plan.Skip.slice(0, 5).map(function (p) { return p.Item.Title + ' (' + p.Reason + ')'; }).join(', ') + (plan.Skip.length > 5 ? ' and more.' : '') }));
                        }
                        var foot = el('div', { className: 'jc-review-foot' });
                        var close = el('button', { type: 'button', className: 'jc-btn', textContent: 'Not now' });
                        close.addEventListener('click', function () { box.hidden = true; });
                        foot.append(close);
                        if (plan.Remove.length) {
                            var go = el('button', { type: 'button', className: 'jc-btn danger', textContent: binDays ? 'Move to recycle bin' : 'Delete from disk' });
                            go.addEventListener('click', function () {
                                go.disabled = true;
                                call('POST', 'Remove', { Ids: plan.Remove.map(function (p) { return p.Item.Id; }) }).then(function () {
                                    box.hidden = true;
                                    watchRemoval();
                                }).catch(function (err) { go.disabled = false; window.alert('Could not start: ' + err.message); });
                            });
                            foot.append(go);
                        }
                        box.append(foot);
                        box.querySelector('button:last-child').focus();
                    }).catch(function (err) { box.textContent = 'Could not prepare the removal: ' + err.message; });
                }

                var watching = false;
                function watchRemoval() {
                    if (watching) { return; }
                    watching = true;
                    (function check() {
                        call('GET', 'Remove').then(function (p) {
                            if (p.Running) {
                                status('Removing ' + Math.min(p.Done + 1, p.Total || 1) + ' of ' + (p.Total || '?') + (p.Current ? ': ' + p.Current : '') + '. It carries on if you leave this page.');
                                setTimeout(check, 1500);
                                return;
                            }
                            watching = false;
                            status(p.Error ? 'The removal stopped: ' + p.Error + '. See the Activity tab.'
                                : p.Result ? 'Done: removed ' + plural(p.Result.Remove.length, 'item', 'items') + ', ' + p.Result.Size + '.' + (p.Result.Skip.length ? ' ' + p.Result.Skip.length + ' kept, see the Activity tab.' : '') : '');
                            setTimeout(function () { status(''); }, 15000);
                            loadList();
                        }).catch(function () { setTimeout(check, 3000); });
                    })();
                }

                // Rules

                function nextRun(v) {
                    if (!v.Schedule) { return null; }
                    if (!v.LastRun) { return 'within the hour'; }
                    var last = new Date(v.LastRun);
                    var next = new Date(last.getFullYear(), last.getMonth(), last.getDate(), v.Hour);
                    while (next <= last || (v.Schedule === 'weekly' && DAYS[next.getDay()] !== v.Day)) { next.setDate(next.getDate() + 1); }
                    return when(next);
                }

                function loadRules() {
                    return ApiClient.getPluginConfiguration(pluginId).then(function (c) {
                        config = c;
                        renderRules();
                    });
                }

                function save(view, saved) {
                    saved.textContent = 'Saving...';
                    var body = Object.assign({}, view);
                    return call('POST', 'Views', body).then(function () {
                        saved.textContent = 'Saved';
                        setTimeout(function () { saved.textContent = ''; }, 2000);
                    }).catch(function (err) { saved.textContent = 'Not saved: ' + err.message; });
                }

                function field(label, control) { return el('label', {}, label, control); }

                function select(options, value) {
                    var s = el('select', {});
                    options.forEach(function (o) { s.append(el('option', { value: o[0], textContent: o[1] })); });
                    s.value = value;
                    return s;
                }

                function renderRules() {
                    var box = $('jcRules');
                    box.textContent = '';
                    var views = config.Views || [];
                    if (!views.length) {
                        box.append(el('p', { className: 'jc-empty', textContent: 'No rules yet. Set a filter on the Library page and choose "Schedule for Leaving soon".' }));
                    }
                    views.forEach(function (view) {
                        if (!view.Schedule && view.CheckDaily) { view.Schedule = 'daily'; }
                        view.CheckDaily = false;
                        if (typeof view.Day === 'number') { view.Day = DAYS[view.Day]; }
                        view.Day = view.Day || 'Monday';
                        if (view.Hour == null) { view.Hour = 4; }

                        var saved = el('span', { className: 'jc-saved', role: 'status' });
                        var info = el('small', {});
                        function describe() {
                            var next = nextRun(view);
                            info.textContent = (view.LastRun ? 'Last run ' + when(view.LastRun) + ', ' + view.LastAdded + ' added. ' : 'Not run yet. ') + (next ? 'Next: ' + next + '.' : 'Not scheduled.');
                        }
                        describe();

                        var schedule = select([['', 'Not scheduled'], ['daily', 'Every day'], ['weekly', 'Every week']], view.Schedule || '');
                        var day = select(DAYS.map(function (d) { return [d, d]; }), view.Day);
                        var dayField = field('Day', day);
                        dayField.hidden = view.Schedule !== 'weekly';
                        var hours = [];
                        for (var h = 0; h < 24; h++) { hours.push([String(h), (h < 10 ? '0' : '') + h + ':00']); }
                        var hour = select(hours, String(view.Hour));
                        var notice = el('input', { type: 'number', min: '0', inputMode: 'numeric', value: view.NoticeDays || '', placeholder: String(config.NoticeDays) + ' (default)' });

                        function changed() {
                            view.Schedule = schedule.value;
                            view.Day = day.value;
                            view.Hour = Number(hour.value);
                            view.NoticeDays = Math.max(0, Number(notice.value) || 0);
                            dayField.hidden = view.Schedule !== 'weekly';
                            describe();
                            save(view, saved);
                        }
                        [schedule, day, hour].forEach(function (s) { s.addEventListener('change', changed); });
                        notice.addEventListener('change', changed);

                        var auto = el('button', { type: 'button', className: 'jc-toggle' }, el('span', { className: 'jc-switch', ariaHidden: 'true' }), el('span', { textContent: 'Remove when due, without asking (through the recycle bin)' }));
                        auto.setAttribute('role', 'switch');
                        auto.setAttribute('aria-checked', String(!!view.AutoRemove));
                        auto.addEventListener('click', function () {
                            if (!view.AutoRemove && !window.confirm('Items from "' + view.Name + '" will be removed on their own once due. They wait in the recycle bin first. Continue?')) { return; }
                            view.AutoRemove = !view.AutoRemove;
                            auto.setAttribute('aria-checked', String(view.AutoRemove));
                            save(view, saved);
                        });

                        var run = el('button', { type: 'button', className: 'jc-btn', textContent: 'Run now' });
                        run.addEventListener('click', function () {
                            run.disabled = true;
                            run.textContent = 'Running...';
                            call('POST', 'LeavingSoon/Run?view=' + encodeURIComponent(view.Name)).then(function () {
                                return Promise.all([loadRules(), loadList()]);
                            }).then(function () {
                                var fresh = (config.Views || []).filter(function (v) { return v.Name === view.Name; })[0];
                                status('"' + view.Name + '" ran: ' + plural(fresh ? fresh.LastAdded : 0, 'new item', 'new items') + ' on the list.');
                            }).catch(function (err) { window.alert(err.message); run.disabled = false; run.textContent = 'Run now'; });
                        });
                        var remove = el('button', { type: 'button', className: 'jc-btn danger', textContent: 'Delete' });
                        remove.setAttribute('aria-label', 'Delete rule ' + view.Name);
                        remove.addEventListener('click', function () {
                            if (!window.confirm('Delete the rule "' + view.Name + '"? Items it already put on the list stay there.')) { return; }
                            call('DELETE', 'Views?name=' + encodeURIComponent(view.Name)).then(loadRules);
                        });

                        box.append(el('div', { className: 'jc-rule' },
                            el('div', { className: 'jc-rule-head' }, el('b', { textContent: view.Name }), info, saved),
                            el('div', { className: 'jc-rule-grid' }, field('Schedule', schedule), dayField, field('At', hour), field('Notice days', notice)),
                            el('div', { className: 'jc-rule-foot' }, auto, run, remove)));
                    });
                }

                page.addEventListener('click', function (e) {
                    var b = e.target.closest('button');
                    if (!b || !page.contains(b)) { return; }
                    if (b.classList.contains('jc-tab') && b.dataset.page) {
                        Dashboard.navigate(Dashboard.getPluginUrl(b.dataset.page));
                    } else if (b.id === 'jcReview') {
                        review();
                    } else if (b.dataset.cancel) {
                        b.disabled = true;
                        call('POST', 'LeavingSoon/Cancel', { Ids: [b.dataset.cancel] }).then(loadList);
                    } else if (b.dataset.more) {
                        limit[b.dataset.more] += 50;
                        renderList();
                    } else if (b.id === 'jcRunAll') {
                        b.disabled = true;
                        call('POST', 'LeavingSoon/Run').then(function () { return Promise.all([loadRules(), loadList()]); })
                            .then(function () { status('All scheduled rules ran.'); })
                            .catch(function (err) { window.alert(err.message); })
                            .finally(function () { b.disabled = false; });
                    }
                });

                page.addEventListener('pageshow', function () {
                    call('GET', 'Overview').then(function (o) {
                        users = {};
                        (o.Users || []).forEach(function (u) { users[u.Id] = u.Name; });
                        userCount = (o.Users || []).length;
                        renderList();
                    }).catch(function () {});
                    loadRules();
                    loadList();
                    call('GET', 'Remove').then(function (p) { if (p.Running) { watchRemoval(); } }).catch(function () {});
                });
            })();
        </script>
    </div>
</body>
</html>
