name: Release

# Run by hand from Actions > Release > Run workflow. Publishes a release with the plugin zip and manifest.json, so Jellyfin can install from:
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
#
# Versioning: fill in "Version" to release that exact version. Left empty, it counts the last number of the
# latest release up, including releases made by hand (v0.1.0 becomes 0.1.1). With no release yet it uses
# "version" in .github/plugin.json. "Release notes" goes into the release, the manifest and Jellyfin.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, like 0.2.0. Leave empty to count up from the last release.'
        required: false
        default: ''
      notes:
        description: 'Release notes'
        required: true
        default: 'Bug fixes and feature updates'

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pick version
        run: |
          BASE=$(jq -r .version .github/plugin.json)
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LATEST=${LATEST#v}
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.1.0, got '$INPUT_VERSION'"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$INPUT_VERSION" >/dev/null; then
              echo "::error::Version $INPUT_VERSION is already released"; exit 1
            fi
            VERSION=$INPUT_VERSION
          elif [ -z "$LATEST" ]; then
            VERSION=$BASE
          else
            VERSION="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
          fi
          echo "Releasing $VERSION (last release: ${LATEST:-none})"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION.0" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test JellyClean.slnx

      - name: Build zip
        run: |
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ZIP="jellyclean_${VERSION}.zip"
          dotnet publish Jellyfin.Plugin.JellyClean -c Release -o out -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"
          # meta.json makes the zip work as a standalone install too: unzip into plugins/JellyClean and restart.
          jq --arg v "$VERSION" --arg ts "$TS" --arg notes "$NOTES" \
            '{guid, name, overview, description, owner, category, targetAbi, version: $v, changelog: $notes, timestamp: $ts, status: "Active", autoUpdate: true, imagePath: "jellyclean.png", assemblies: []}' \
            .github/plugin.json > out/meta.json
          cp docs/jellyclean.png out/
          (cd out && zip "../$ZIP" Jellyfin.Plugin.JellyClean.dll meta.json jellyclean.png)
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Build manifest
        run: |
          # Keep the versions of the previous release so older versions stay installable;
          # everything else comes fresh from .github/plugin.json.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json --output previous.json \
            || echo '[{"versions": []}]' > previous.json
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          jq --slurpfile prev previous.json --arg v "$VERSION" --arg ts "$TS" --arg url "$URL" --arg notes "$NOTES" \
             --arg sum "$(md5sum "$ZIP" | cut -d' ' -f1)" \
             '[del(.version) + {versions: ([{version: $v, changelog: $notes, targetAbi: .targetAbi, sourceUrl: $url, checksum: $sum, timestamp: $ts}]
                + [$prev[0][0].versions[] | select(.version != $v)])} | del(.targetAbi)]' \
             .github/plugin.json > manifest.json
          cat manifest.json

      - name: Publish release
        run: |
          gh release create "$TAG" "$ZIP" manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "JellyClean $TAG" --notes "$NOTES"
